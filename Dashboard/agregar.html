<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopMaster - Agregar Producto</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>ShopMaster - Nuevo Producto</h1>
  </header>

  <main class="form-container">
    <form id="form-nuevo-producto">
      <div class="form-group">
        <label for="titulo">Título *</label>
        <input type="text" id="titulo" required placeholder="Ej: Smartphone X12">
      </div>

      <div class="form-group">
        <label for="precio">Precio ($)*</label>
        <input type="number" id="precio" step="0.01" min="0.01" required placeholder="99.99">
      </div>

      <div class="form-group">
        <label for="categoria">Categoría *</label>
        <select id="categoria" required>
          <option value="">Selecciona una categoría</option>
        </select>
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción *</label>
        <textarea id="descripcion" rows="5" required placeholder="Describe el producto..."></textarea>
      </div>

      <div class="form-group">
        <label for="marca">Marca (opcional)</label>
        <input type="text" id="marca" placeholder="Ej: Samsung, Apple...">
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secundario" onclick="window.location.href='index.html'">Cancelar</button>
        <button type="submit" class="btn-primario">Guardar Producto</button>
      </div>
    </form>

    <div id="mensaje" class="mensaje oculto"></div>
  </main>

  <script src="agregar.js"></script>
</body>
</html>
